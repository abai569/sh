name: Traffic Release

on:
  push:
    tags:
      - "traffic-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#traffic-v}"
          CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/traffic-linux-${GOARCH}" ./cmd/traffic
      - uses: actions/upload-artifact@v4
        with:
          name: traffic-linux-${{ matrix.arch }}
          path: dist/traffic-linux-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: traffic-linux-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum traffic-linux-* > checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/traffic-linux-amd64
            dist/traffic-linux-arm64
            dist/checksums.txt
